
# Render.com Infrastructure-as-Code Blueprint
# This file defines all services needed for EasyCart deployment on Render
# Automatically deploys backend, frontend, and admin dashboard
#
# NOTE: This deployment is for a PostgreSQL-backed Django backend. All MongoDB references are obsolete.

services:
  # Django Backend API Service
  - type: web
    name: easycart-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
    startCommand: gunicorn ecommerce.wsgi:application --bind 0.0.0.0:$PORT
    releaseCommand: |
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: easycart-backend.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://easycart-1-752r.onrender.com,https://easycart-frontend-zge5.onrender.com,https://easycart-admin.onrender.com
      # PostgreSQL is used. No MongoDB configuration required.
      - key: JWT_SECRET
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: ecommerce.settings
      - key: WEB_CONCURRENCY
        value: 2
  
  # React Frontend Static Site
  - type: web
    name: easycart-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://easycart-backend.onrender.com/api
      - key: NODE_VERSION
        value: 18.17.0
      - key: REACT_APP_SITE_NAME
        value: EasyCart

  # Admin Dashboard Static Site
  - type: web
    name: easycart-admin
    env: static
    region: oregon
    plan: free
    rootDir: admin-dashboard
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://easycart-backend.onrender.com/api
      - key: NODE_VERSION
        value: 18.17.0
      - key: REACT_APP_SITE_NAME
        value: EasyCart Admin


# Database configuration notes:
# - PostgreSQL is used for all production deployments.
# - Set DB_ENGINE, DB_NAME, DB_USER, DB_PASSWORD, DB_HOST, DB_PORT in backend environment variables.
# - Example:
#   DB_ENGINE=django.db.backends.postgresql
#   DB_NAME=easycart
#   DB_USER=easycart_user
#   DB_PASSWORD=your_password
#   DB_HOST=your_postgres_host
#   DB_PORT=5432

# Deployment instructions:
# 1. Push this file to your GitHub repository
# 2. Connect your repo to Render
# 3. Render will automatically detect render.yaml and create all services
# 4. Set PostgreSQL environment variables in backend service environment variables
# 5. Services will auto-deploy on every push to main branch

# Health check endpoint:
# Backend includes /api/health/ endpoint for monitoring
# Render will automatically ping this to verify service health

# Scaling notes:
# - Free tier includes 750 hours/month
# - Backend uses gunicorn with WEB_CONCURRENCY=2 for better performance
# - Static sites have no cold starts
# - Consider upgrading to paid plan for production loads
