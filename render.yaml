services:
  - type: web
    name: easycart-backend
    env: python
    region: oregon
    buildCommand: "cd backend && chmod +x build.sh && ./build.sh"
    startCommand: "cd backend && gunicorn ecommerce.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/health/live/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: easycart-db
          property: connectionString

  - type: web
    name: easycart-frontend
    env: static
    region: oregon
    rootDir: frontend
    buildCommand: "npm ci && CI=false npm run build"
    staticPublishPath: build
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: NODE_VERSION
        value: 20.19.0
