<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Cache Control for Development (prevents Firefox caching issues) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Viewport Configuration (2025 Best Practice) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA Configuration -->
    <meta name="theme-color" content="#10b981" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Shop groceries online with EasyCart. Fast delivery, fresh products, and great prices." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" crossorigin="use-credentials" />

    <!-- iOS PWA Support (Enhanced for 2025) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EasyCart" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192x192.png" />
    <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/icons/icon-512x512.png" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#10b981" />
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/icons/icon-192x192.png" />
    <meta name="msapplication-config" content="%PUBLIC_URL%/browserconfig.xml" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Preconnect to API domains for better performance -->
    <!-- Removed PostHog preconnect links for security and CORS best practices -->

  <!-- Security Headers -->
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 https://easycart-backend-2k8l.onrender.com https://res.cloudinary.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
  <!-- X-Frame-Options for clickjacking protection -->
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <!-- Permissions Policy -->
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
  <!-- Title -->
    <title>EasyCart - Your Online Supermarket</title>

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EasyCart - Your Online Supermarket" />
    <meta property="og:description" content="Shop groceries online with EasyCart. Fast delivery, fresh products, and great prices." />
    <meta property="og:image" content="%PUBLIC_URL%/images/icons/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EasyCart - Your Online Supermarket" />
    <meta name="twitter:description" content="Shop groceries online with EasyCart. Fast delivery, fresh products, and great prices." />

    <!-- Performance: Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://easycart-backend-2k8l.onrender.com" />

    <!-- Google Fonts: Preload critical font + defer full stylesheet -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif;">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run this app.</p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
