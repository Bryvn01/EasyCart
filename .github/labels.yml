- name: needs-documentation
  color: 0075ca
  description: Needs documentation update

- name: good-first-issue
  color: 7057ff
  description: Good for newcomers

- name: good-first-review
  color: 7057ff
  description: Good for new reviewers

- name: help-wanted
  color: 008672
  description: Extra attention needed from community

- name: duplicate
  color: cfd3d7
  description: This issue or PR already exists

- name: invalid
  color: e4e669
  description: This doesn't seem right

- name: wontfix
  color: ffffff
  description: This will not be worked on

- name: question
  color: d876e3
