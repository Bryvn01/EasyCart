name: Automated Branch Cleanup

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup-merged-branches:
    name: Clean Merged Copilot Branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history needed

      - name: Delete merged copilot/fix branches
        run: |
          echo "🔍 Finding merged copilot/fix branches..."

          # Get all remote branches merged into main
          MERGED_BRANCHES=$(git branch -r --merged origin/main | \
            grep "origin/copilot/fix-" | \
            sed 's|origin/||' | \
            sed 's/^[[:space:]]*//')

          if [ -z "$MERGED_BRANCHES" ]; then
            echo "✅ No merged copilot/fix branches to clean up"
            exit 0
          fi

          echo "📋 Branches to delete:"
          echo "$MERGED_BRANCHES"

          COUNT=0
          for branch in $MERGED_BRANCHES; do
            echo "🗑️  Deleting: $branch"
            git push origin --delete "$branch" || echo "⚠️  Failed to delete $branch (may already be deleted)"
            COUNT=$((COUNT+1))
          done

          echo "✨ Deleted $COUNT branches"

      - name: Summary
        run: |
          echo "## Branch Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Merged copilot/fix branches have been cleaned up" >> $GITHUB_STEP_SUMMARY
          echo "- Run date: $(date)" >> $GITHUB_STEP_SUMMARY

  cleanup-stale-branches:
    name: Report Stale Branches
    runs-on: ubuntu-latest
    needs: cleanup-merged-branches

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find stale branches (30+ days)
        run: |
          echo "🔍 Finding stale branches (no commits in 30+ days)..."

          # Get current date in seconds
          CURRENT_DATE=$(date +%s)
          THIRTY_DAYS_AGO=$((CURRENT_DATE - (30 * 24 * 60 * 60)))

          echo "## Stale Branches Report" >> $GITHUB_STEP_SUMMARY
          echo "Branches with no activity in 30+ days:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          STALE_COUNT=0

          # Check all remote branches except main and develop
          for branch in $(git branch -r | grep -v "HEAD\|main\|develop" | sed 's|origin/||' | sed 's/^[[:space:]]*//'); do
            # Get last commit date
            LAST_COMMIT=$(git log -1 --format="%ct" "origin/$branch" 2>/dev/null || echo "0")

            if [ "$LAST_COMMIT" -lt "$THIRTY_DAYS_AGO" ] && [ "$LAST_COMMIT" != "0" ]; then
              DAYS_AGO=$(( (CURRENT_DATE - LAST_COMMIT) / 86400 ))
              echo "- \`$branch\` (${DAYS_AGO} days old)" >> $GITHUB_STEP_SUMMARY
              STALE_COUNT=$((STALE_COUNT+1))
            fi
          done

          if [ "$STALE_COUNT" -eq 0 ]; then
            echo "✅ No stale branches found!" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total stale branches:** $STALE_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 Consider reviewing and deleting these manually or via:\`git push origin --delete <branch-name>\`" >> $GITHUB_STEP_SUMMARY
          fi

  cleanup-dependabot:
    name: Review Dependabot Branches
    runs-on: ubuntu-latest
    needs: cleanup-merged-branches

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: List dependabot branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Checking Dependabot branches..."

          echo "## Dependabot Branches" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get all dependabot branches
          DEPENDABOT_BRANCHES=$(git branch -r | grep "dependabot/" | sed 's|origin/||' | sed 's/^[[:space:]]*//')

          if [ -z "$DEPENDABOT_BRANCHES" ]; then
            echo "✅ No Dependabot branches found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "### Active Dependabot PRs:" >> $GITHUB_STEP_SUMMARY

          for branch in $DEPENDABOT_BRANCHES; do
            # Check if there's an open PR for this branch
            PR_STATE=$(gh pr list --head "$branch" --json state --jq '.[0].state' 2>/dev/null || echo "UNKNOWN")

            if [ "$PR_STATE" = "OPEN" ]; then
              echo "- ✅ \`$branch\` (PR open - ready for review)" >> $GITHUB_STEP_SUMMARY
            elif [ "$PR_STATE" = "MERGED" ]; then
              echo "- 🗑️ \`$branch\` (PR merged - can be deleted)" >> $GITHUB_STEP_SUMMARY
              git push origin --delete "$branch" 2>/dev/null || true
            elif [ "$PR_STATE" = "CLOSED" ]; then
              echo "- 🗑️ \`$branch\` (PR closed - can be deleted)" >> $GITHUB_STEP_SUMMARY
              git push origin --delete "$branch" 2>/dev/null || true
            fi
          done
