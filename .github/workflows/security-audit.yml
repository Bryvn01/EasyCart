name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:  # Manual trigger
  pull_request:
    branches: [main]

jobs:
  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run npm audit
        run: cd frontend && npm audit --audit-level=moderate
        continue-on-error: true

      - name: Generate audit report
        run: cd frontend && npm audit --json > ../frontend-audit.json
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-report
          path: frontend-audit.json

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit safety

      - name: Run pip-audit
        run: cd backend && pip-audit --format json > ../backend-audit.json
        continue-on-error: true

      - name: Run safety check
        run: cd backend && safety check --json > ../backend-safety.json
        continue-on-error: true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-report
          path: |
            backend-audit.json
            backend-safety.json
