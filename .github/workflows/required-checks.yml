name: Required Checks

on:
  push:
    branches: [main, develop, 'feat/*', 'feature/*', 'fix/*']
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    name: test-and-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: easycart
          POSTGRES_PASSWORD: easycart
          POSTGRES_DB: easycart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: ecommerce.settings
      SECRET_KEY: testsecretkey
      DEBUG: True
      DB_ENGINE: django.db.backends.postgresql
      DB_USER: easycart
      DB_PASSWORD: easycart
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: easycart
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install coverage

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline

      - name: Create backend .env file
        working-directory: ./backend
        run: |
          cat > .env <<'EOF'
          # CI-only settings (non-production)
          DJANGO_SETTINGS_MODULE=ecommerce.settings
          SECRET_KEY=test-secret-key-for-ci-only
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001

          DB_ENGINE=django.db.backends.postgresql
          DB_NAME=easycart
          DB_USER=easycart
          DB_PASSWORD=easycart
          DB_HOST=localhost
          DB_PORT=5432

          REDIS_URL=redis://localhost:6379/1
          HEALTHCHECK_CACHE_ENABLED=False

          # External services disabled in CI
          TWILIO_ACCOUNT_SID=
          TWILIO_AUTH_TOKEN=
          TWILIO_PHONE_NUMBER=

          # Cloudinary defaults for tests
          CLOUDINARY_CLOUD_NAME=test-cloud
          CLOUDINARY_API_KEY=test-key
          CLOUDINARY_API_SECRET=test-secret
          CLOUDINARY_URL=cloudinary://test-key:test-secret@test-cloud
          EOF

      - name: Run migrations
        working-directory: ./backend
        env:
          TWILIO_ACCOUNT_SID: ''
          TWILIO_AUTH_TOKEN: ''
          TWILIO_PHONE_NUMBER: ''
          CLOUDINARY_URL: cloudinary://test-key:test-secret@test-cloud
          HEALTHCHECK_CACHE_ENABLED: 'False'
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run backend tests
        working-directory: ./backend
        env:
          TWILIO_ACCOUNT_SID: ''
          TWILIO_AUTH_TOKEN: ''
          TWILIO_PHONE_NUMBER: ''
          CLOUDINARY_URL: cloudinary://test-key:test-secret@test-cloud
          HEALTHCHECK_CACHE_ENABLED: 'False'
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          python manage.py test --verbosity=2 --keepdb --parallel=2

      - name: Run frontend tests
        working-directory: ./frontend
        env:
          CI: true
          NODE_ENV: test
          REACT_APP_API_URL: http://localhost:8000/api
        run: npm test -- --watchAll=false --passWithNoTests --maxWorkers=2
        continue-on-error: true

      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: false
          NODE_ENV: production
          REACT_APP_API_URL: http://localhost:8000/api
          GENERATE_SOURCEMAP: false
        run: npm run build --if-present
