name: Auto-create Issue on Workflow Failure

on:
  workflow_run:
    workflows: ["CI-CD-Pipeline"]
    types:
      - completed

jobs:
  create-issue-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check for existing similar issue
        id: check-existing
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const commitSha = run.head_sha;

            // Check for existing open issues for this commit
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure,automated',
              per_page: 100
            });

            // Check if there's an issue for this commit already
            const issueExists = existingIssues.data.some(issue =>
              issue.body && issue.body.includes(commitSha)
            );

            if (issueExists) {
              core.info('Similar issue already exists, skipping creation');
              return { shouldCreate: false };
            }

            // Only create if this is the first failure in the last hour
            const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000);
            const recentIssues = existingIssues.data.filter(issue =>
              new Date(issue.created_at) > oneHourAgo
            );

            if (recentIssues.length >= 3) {
              core.info('Too many recent CI failure issues, skipping to avoid spam');
              return { shouldCreate: false };
            }

            return { shouldCreate: true };

      - name: Create issue for failed workflow
        if: steps.check-existing.outputs.result && fromJSON(steps.check-existing.outputs.result).shouldCreate
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const commitSha = run.head_sha;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI/CD Failure: ${run.name} on ${run.head_branch}`,
              body: `## 🔴 CI/CD Pipeline Failure\n\n` +
                    `**Workflow:** [${run.name}](${run.html_url})\n` +
                    `**Branch:** \`${run.head_branch}\`\n` +
                    `**Commit:** [${commitSha.substring(0, 7)}](${commitUrl})\n` +
                    `**Author:** @${run.triggering_actor.login}\n` +
                    `**Triggered:** ${run.event}\n\n` +
                    `### 📋 Next Steps\n\n` +
                    `1. Check the [workflow logs](${run.html_url}) for details\n` +
                    `2. Review the failed commit changes\n` +
                    `3. Fix the issues locally and push a new commit\n` +
                    `4. This issue will auto-close when CI passes\n\n` +
                    `---\n` +
                    `*This issue was automatically created. To disable these notifications, ` +
                    `edit \`.github/workflows/auto-issue-on-failure.yml\`*`,
              labels: ['ci-failure', 'automated']
            });
