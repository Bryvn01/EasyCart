name: Auto-create Issue on Workflow Failure

on:
  workflow_run:
    workflows: ["CI-CD-Pipeline"]
    types:
      - completed

jobs:
  create-issue-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            await github.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI/CD Failure: ${run.name} #${run.id}`,
              body: `The workflow [${run.name}](${run.html_url}) failed on commit ${run.head_commit.id} by @${run.head_commit.author.name}.\n\nCheck the logs for details.`,
              labels: ['ci-failure', 'automated']
            });
