name: Auto-Delete Merged Branches

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (show what would be deleted without deleting)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged PR branch
        if: github.event_name == 'pull_request'
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Deleting merged branch: $BRANCH_NAME"
          git push origin --delete "$BRANCH_NAME" || echo "Branch already deleted or does not exist"

      - name: Cleanup stale branches (Manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "🔍 Scanning for stale branches..."

          # Get list of remote branches merged into main
          MERGED_BRANCHES=$(git branch -r --merged origin/main | \
            grep -v "HEAD" | \
            grep -v "origin/main" | \
            grep -v "origin/develop" | \
            sed 's/origin\///')

          if [ -z "$MERGED_BRANCHES" ]; then
            echo "✅ No stale branches found"
            exit 0
          fi

          echo "📋 Found merged branches:"
          echo "$MERGED_BRANCHES"

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "🔒 DRY RUN MODE - No branches will be deleted"
            echo "To actually delete, run this workflow with dry_run=false"
          else
            echo ""
            echo "🗑️ Deleting merged branches..."
            for branch in $MERGED_BRANCHES; do
              echo "Deleting: $branch"
              git push origin --delete "$branch" || echo "Failed to delete $branch"
            done
            echo "✅ Cleanup complete"
          fi

      - name: Summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "## Branch Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL_REMOTE=$(git branch -r | grep -v "HEAD" | wc -l)
          MERGED_COUNT=$(git branch -r --merged origin/main | grep -v "HEAD" | grep -v "origin/main" | grep -v "origin/develop" | wc -l)

          echo "**Total Remote Branches:** $TOTAL_REMOTE" >> $GITHUB_STEP_SUMMARY
          echo "**Merged Branches:** $MERGED_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Check logs above for details" >> $GITHUB_STEP_SUMMARY
