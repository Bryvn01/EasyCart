name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'
      node-version:
        required: false
        type: string
        default: '18'
      run-frontend-tests:
        required: false
        type: boolean
        default: true
    secrets:
      CLOUDINARY_API_KEY:
        required: false
      CLOUDINARY_API_SECRET:
        required: false
      CLOUDINARY_CLOUD_NAME:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: easycart
          POSTGRES_PASSWORD: easycart_test_password
          POSTGRES_DB: easycart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Django Configuration
      DJANGO_SETTINGS_MODULE: ecommerce.settings
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY || 'django-insecure-test-key-for-ci-only-12345' }}
      DEBUG: True

      # Database Configuration
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: easycart_test
      DB_USER: easycart
      DB_PASSWORD: easycart_test_password
      DB_HOST: localhost
      DB_PORT: 5432

      # Network Configuration
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001

      # External Services (disabled for CI)
      HEALTHCHECK_CACHE_ENABLED: False
      TWILIO_ACCOUNT_SID: ''
      TWILIO_AUTH_TOKEN: ''
      TWILIO_PHONE_NUMBER: ''

      # Cloudinary Configuration (optional)
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || 'test-key' }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || 'test-secret' }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'test-cloud' }}
      CLOUDINARY_URL: cloudinary://${{ secrets.CLOUDINARY_API_KEY || 'test-key' }}:${{ secrets.CLOUDINARY_API_SECRET || 'test-secret' }}@${{ secrets.CLOUDINARY_CLOUD_NAME || 'test-cloud' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Node.js ${{ inputs.node-version }}
        if: inputs.run-frontend-tests
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install coverage flake8 bandit

      - name: Lint backend (flake8)
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Security scan (bandit)
        run: |
          cd backend
          bandit -r apps/ -ll -f txt || true
        continue-on-error: true

      - name: Run Django migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

      - name: Run backend tests with coverage
        run: |
          cd backend
          coverage run --source='apps' manage.py test --verbosity=2
          coverage report
          coverage xml

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Install frontend dependencies
        if: inputs.run-frontend-tests
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Lint frontend (ESLint)
        if: inputs.run-frontend-tests
        run: |
          cd frontend
          npm run lint
        continue-on-error: true

      - name: Run frontend tests
        if: inputs.run-frontend-tests
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8000/api
        run: |
          cd frontend
          npm test -- --watchAll=false --coverage --maxWorkers=2

      - name: Upload frontend coverage
        if: inputs.run-frontend-tests
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

      - name: Build frontend
        if: inputs.run-frontend-tests
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:8000/api
          GENERATE_SOURCEMAP: false
        run: |
          cd frontend
          npm run build

      - name: Collect static files
        run: |
          cd backend
          python manage.py collectstatic --noinput --clear

      - name: Check deployment readiness
        run: |
          cd backend
          python manage.py check --deploy --fail-level WARNING || true
