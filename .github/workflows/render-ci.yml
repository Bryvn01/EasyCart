name: EasyCart CI (Render)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full Test Suite (Render)
    uses: ./.github/workflows/reusable-test.yml
    secrets:
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}

  legacy-test:
    name: Legacy Test (Deprecated)
    runs-on: ubuntu-latest
    if: false  # Disabled - using reusable workflow instead

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: easycart
          POSTGRES_PASSWORD: easycart
          POSTGRES_DB: easycart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Django requires these environment variables for tests
      - name: Run backend tests
        env:
          SECRET_KEY: django-insecure-test-key-for-ci-only-12345
          DEBUG: True
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: easycart_test
          DB_USER: easycart
          DB_PASSWORD: easycart
          DB_HOST: localhost
          DB_PORT: 5432
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          HEALTHCHECK_CACHE_ENABLED: False
          TWILIO_ACCOUNT_SID: ''
          TWILIO_AUTH_TOKEN: ''
          TWILIO_PHONE_NUMBER: ''
        run: |
          cd backend
          python manage.py test

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        env:
          REACT_APP_API_URL: http://localhost:8000/api
        run: |
          cd frontend
          npm test -- --watchAll=false

      - name: Build frontend
        env:
          REACT_APP_API_URL: http://localhost:8000/api
        run: |
          cd frontend
          npm run build

      # Optional: Trigger Render Deploy Hook (if you want to control deploy timing)
      # - name: Trigger Render Deploy
      #   run: |
      #     curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
