name: CI-CD-Pipeline
on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - main
      - develop
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: easycart
          POSTGRES_PASSWORD: easycart
          POSTGRES_DB: easycart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: ecommerce.settings
      SECRET_KEY: testsecretkey
      DEBUG: True
      DB_ENGINE: django.db.backends.postgresql
      DB_USER: easycart
      DB_PASSWORD: easycart
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: easycart
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_URL: cloudinary://${{ secrets.CLOUDINARY_API_KEY }}:${{ secrets.CLOUDINARY_API_SECRET }}@${{ secrets.CLOUDINARY_CLOUD_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install backend dependencies
        run: cd backend && pip install -r requirements.txt && pip install flake8
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Run npm audit (frontend)
        run: cd frontend && npm audit --audit-level=high --production || true
        continue-on-error: true
      - name: Lint backend
        run: cd backend && flake8 . || echo "Linting completed with warnings"
        continue-on-error: true
      - name: Security scan (Bandit)
        run: cd backend && pip install bandit && bandit -r apps/ -f txt || echo "Security scan completed"
        continue-on-error: true
      - name: Lint frontend
        run: cd frontend && npm run lint
        continue-on-error: false
      - name: Run backend tests
        run: cd backend && python manage.py test
        env:
          DJANGO_SETTINGS_MODULE: ecommerce.settings
          SECRET_KEY: testsecretkey
          DEBUG: True
          DB_ENGINE: django.db.backends.postgresql
          DB_USER: easycart
          DB_PASSWORD: easycart
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: easycart
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
      - name: Run frontend tests
        run: cd frontend && npm test -- --coverage --watchAll=false --passWithNoTests
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: backend/coverage.xml
          flags: backend
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
      - name: Build frontend
        run: cd frontend && CI=false npm run build
      - name: Build backend (collectstatic)
        run: cd backend && python manage.py collectstatic --noinput
