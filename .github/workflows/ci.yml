name: CI-CD-Pipeline
on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
  pull_request:
    branches:
      - main
      - develop
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: easycart
          POSTGRES_PASSWORD: easycart
          POSTGRES_DB: easycart
        ports:
          - 5432:5432
    env:
      DJANGO_SETTINGS_MODULE: ecommerce.settings
      SECRET_KEY: testsecretkey
      DB_USER: easycart
      DB_PASSWORD: easycart
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: easycart
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install backend dependencies
        run: cd backend && pip install -r requirements.txt
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Run npm audit (frontend)
        run: cd frontend && npm audit --audit-level=high --production
      - name: Security scan (Bandit)
        run: cd backend && pip install bandit && bandit -r apps/ -f txt || true
      - name: Lint frontend
        run: cd frontend && npm run lint
      - name: Run backend tests
        run: cd backend && python manage.py test
      - name: Run frontend tests
        run: cd frontend && npm test -- --coverage --watchAll=false
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build backend (collectstatic)
        run: cd backend && python manage.py collectstatic --noinput
