# CodeQL Security Analysis Workflow
# Performs advanced security scanning for Python (Django) and JavaScript (React)
# Blocks merges if High or Critical severity issues are found
# Compatible with branch protection rules

name: "CodeQL Security Scan"

on:
  # Run on all pushes to main and develop branches
  push:
    branches: [ main, develop ]
  # Run on all pull requests targeting main
  pull_request:
    branches: [ main ]
  # Run on a schedule to catch newly disclosed vulnerabilities
  schedule:
    # Run every Monday at 06:00 UTC (before Dependabot runs at 09:00)
    - cron: '0 6 * * 1'
  # Allow manual triggering for ad-hoc security checks
  workflow_dispatch:

# Ensure only one CodeQL scan runs at a time per branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Analyze Python code (Django backend)
  analyze-python:
    name: Analyze Python (Django Backend)
    runs-on: ubuntu-latest
    # Required for uploading CodeQL results
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialize CodeQL for Python analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Use the default CodeQL query suite plus security-extended queries
          # This provides comprehensive security coverage including:
          # - SQL injection detection
          # - XSS vulnerabilities
          # - Path traversal issues
          # - Insecure deserialization
          # - Authentication bypass
          queries: security-extended

      # Set up Python environment matching production
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install dependencies for better analysis accuracy
      # CodeQL can analyze code with dependencies for more accurate results
      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
          # Upload SARIF results for detailed vulnerability reporting
          upload: true

      # Check for High/Critical severity issues
      # This step blocks the workflow if critical issues are found
      - name: Check for High/Critical Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the SARIF file generated by CodeQL
            const sarifDir = process.env.RUNNER_TEMP;
            const files = fs.readdirSync(sarifDir);
            const sarifFile = files.find(f => f.endsWith('.sarif'));
            
            if (!sarifFile) {
              console.log('No SARIF file found, skipping severity check');
              return;
            }
            
            const sarifPath = path.join(sarifDir, sarifFile);
            const sarifData = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
            
            // Count issues by severity
            let highIssues = 0;
            let criticalIssues = 0;
            
            for (const run of sarifData.runs || []) {
              for (const result of run.results || []) {
                const level = result.level || 'none';
                const severity = result.properties?.['security-severity'];
                
                // Critical: security-severity >= 9.0 or level = 'error'
                // High: security-severity >= 7.0
                if (severity >= 9.0 || level === 'error') {
                  criticalIssues++;
                } else if (severity >= 7.0) {
                  highIssues++;
                }
              }
            }
            
            console.log(`Found ${criticalIssues} Critical and ${highIssues} High severity issues`);
            
            // Block merge if High or Critical issues found
            if (highIssues > 0 || criticalIssues > 0) {
              core.setFailed(
                `❌ Security scan failed: Found ${criticalIssues} Critical and ${highIssues} High severity issues. ` +
                `Please review the CodeQL results and fix the issues before merging.`
              );
            } else {
              console.log('✅ No High or Critical security issues found');
            }

  # Analyze JavaScript/TypeScript code (React frontend and admin)
  analyze-javascript:
    name: Analyze JavaScript (React Frontend)
    runs-on: ubuntu-latest
    # Required for uploading CodeQL results
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialize CodeQL for JavaScript/TypeScript analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          # Use the default CodeQL query suite plus security-extended queries
          # This provides comprehensive security coverage including:
          # - XSS vulnerabilities
          # - Injection attacks
          # - Insecure randomness
          # - Prototype pollution
          # - ReDoS (Regular Expression Denial of Service)
          queries: security-extended

      # Set up Node.js environment matching production
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            admin-dashboard/package-lock.json

      # Install dependencies for better analysis accuracy
      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Backend npm dependencies
        run: |
          cd backend
          npm ci || echo "No backend npm dependencies"

      - name: Install Admin Dashboard dependencies
        run: |
          cd admin-dashboard
          npm ci

      # Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
          # Upload SARIF results for detailed vulnerability reporting
          upload: true

      # Check for High/Critical severity issues
      # This step blocks the workflow if critical issues are found
      - name: Check for High/Critical Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the SARIF file generated by CodeQL
            const sarifDir = process.env.RUNNER_TEMP;
            const files = fs.readdirSync(sarifDir);
            const sarifFile = files.find(f => f.endsWith('.sarif'));
            
            if (!sarifFile) {
              console.log('No SARIF file found, skipping severity check');
              return;
            }
            
            const sarifPath = path.join(sarifDir, sarifFile);
            const sarifData = JSON.parse(fs.readFileSync(sarifPath, 'utf8'));
            
            // Count issues by severity
            let highIssues = 0;
            let criticalIssues = 0;
            
            for (const run of sarifData.runs || []) {
              for (const result of run.results || []) {
                const level = result.level || 'none';
                const severity = result.properties?.['security-severity'];
                
                // Critical: security-severity >= 9.0 or level = 'error'
                // High: security-severity >= 7.0
                if (severity >= 9.0 || level === 'error') {
                  criticalIssues++;
                } else if (severity >= 7.0) {
                  highIssues++;
                }
              }
            }
            
            console.log(`Found ${criticalIssues} Critical and ${highIssues} High severity issues`);
            
            // Block merge if High or Critical issues found
            if (highIssues > 0 || criticalIssues > 0) {
              core.setFailed(
                `❌ Security scan failed: Found ${criticalIssues} Critical and ${highIssues} High severity issues. ` +
                `Please review the CodeQL results and fix the issues before merging.`
              );
            } else {
              console.log('✅ No High or Critical security issues found');
            }

  # Summary job that requires all analyses to pass
  # This job can be used in branch protection rules
  codeql-summary:
    name: CodeQL Security Summary
    runs-on: ubuntu-latest
    needs: [analyze-python, analyze-javascript]
    if: always()
    steps:
      - name: Check analysis results
        run: |
          if [ "${{ needs.analyze-python.result }}" != "success" ] || [ "${{ needs.analyze-javascript.result }}" != "success" ]; then
            echo "❌ CodeQL analysis failed. Please review the security findings."
            exit 1
          fi
          echo "✅ All CodeQL security scans passed successfully"

# How to use with Branch Protection Rules:
# 1. Go to Settings > Branches > Branch protection rules
# 2. Select "main" branch
# 3. Enable "Require status checks to pass before merging"
# 4. Add "CodeQL Security Summary" to required status checks
# 5. This ensures PRs cannot be merged if High/Critical issues are found

# Best Practices Implemented:
# 1. Separate jobs for Python and JavaScript for parallel execution
# 2. Security-extended queries for comprehensive vulnerability detection
# 3. Automated blocking of High/Critical severity issues
# 4. Scheduled scans to catch newly disclosed vulnerabilities
# 5. Caching for faster execution
# 6. Clear logging and error messages
# 7. Compatible with existing CI/CD pipelines
# 8. Minimal overhead with concurrency control
